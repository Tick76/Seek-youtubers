<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrap Mechanic — Статус игроков (отладка)</title>
    <style>
        :root {
            --bg: #0d1117; --card-bg: #161b22; --border: #21262d;
            --text: #c9d1d9; --text-secondary: #8b949e;
            --online: #3fb950; --offline: #6e7681; --in-game: #90caf9;
            --scrap: #f0883e;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg); color: var(--text);
            min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background-image: radial-gradient(ellipse at 50% 30%, rgba(240,136,62,0.06) 0%, transparent 60%);
        }
        .container { display: flex; flex-wrap: wrap; gap: 24px; padding: 30px; justify-content: center; }
        .card {
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: 18px; padding: 24px; width: 320px;
            transition: transform 0.2s;
        }
        .card:hover { transform: translateY(-5px); box-shadow: 0 16px 32px rgba(0,0,0,0.5); }
        .status-line {
            display: flex; align-items: center; gap: 8px; font-weight: 600;
            padding: 6px 10px; border-radius: 6px; margin-bottom: 16px;
            background: rgba(255,255,255,0.03);
        }
        .status-line.offline { color: var(--offline); border-left: 3px solid var(--offline); }
        .status-line.online  { color: var(--online); border-left: 3px solid var(--online); }
        .status-line.in-game  { color: var(--in-game); border-left: 3px solid var(--in-game); background: rgba(144,202,249,0.05); }
        .header-row { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
        .avatar { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; border: 3px solid #333; background: #1e2530; }
        .info h3 { font-size: 1.2rem; color: #fff; margin-bottom: 2px; }
        .info .handle { font-size: 0.8rem; color: var(--text-secondary); }
        .divider { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
        .game-section { display: flex; align-items: center; gap: 12px; }
        .game-icon { font-size: 24px; width: 40px; height: 40px; background: #1e2530; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
        .game-detail .label { font-size: 0.65rem; text-transform: uppercase; color: var(--text-secondary); }
        .game-detail .value { font-weight: 600; color: #e6edf3; }
        .extra { font-size: 0.7rem; color: var(--text-secondary); margin-top: 4px; }
        .btn-refresh {
            margin-top: 20px; padding: 10px 20px; background: var(--scrap);
            border: none; border-radius: 8px; font-weight: bold; cursor: pointer;
            color: #000; font-family: inherit;
        }
        .btn-refresh:hover { background: #f79a55; }
        .footer-note { margin-top: 20px; font-size: 0.75rem; color: var(--text-secondary); text-align: center; }
        .debug-panel {
            background: #1a1a2e; color: #ccc; font-family: monospace; font-size: 0.7rem;
            padding: 10px; margin-top: 20px; max-width: 600px; white-space: pre-wrap;
            border-radius: 8px; border: 1px solid #333;
        }
        .warning { color: #f0883e; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container" id="cardsContainer">Загрузка...</div>
    <div class="btn-refresh" onclick="fetchStatuses()">🔄 Обновить сейчас</div>
    <div class="footer-note">
        Используется прокси corsproxy.io. Если не видно данных — проблема с ключом API.
    </div>
    <div class="debug-panel" id="debugInfo"></div>

    <script>
        const API_KEY = '528A8835C087E3CFCAD12AF870392E7B';
        const USERS = [
            { steamid: '76561198023227719', name: 'BummerBum', handle: 'Александр' },
            { steamid: '76561199804148206', name: 'СЕДАЯ ВОРОНА', handle: '' }
        ];

        async function fetchStatuses() {
            const container = document.getElementById('cardsContainer');
            const debug = document.getElementById('debugInfo');
            container.innerHTML = 'Запрос через corsproxy.io...';
            debug.textContent = 'Отправка запроса...';

            const ids = USERS.map(u => u.steamid).join(',');
            const apiUrl = `https://api.steampowered.com/ISteamUser/GetPlayerSummaries/v0002/?key=${API_KEY}&steamids=${ids}`;
            const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(apiUrl)}`;

            try {
                const response = await fetch(proxyUrl);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                
                // Показываем сырой JSON на странице
                debug.textContent = JSON.stringify(data, null, 2);
                console.log('Steam API response:', data);

                if (!data.response || !data.response.players) {
                    throw new Error('Нет поля response.players');
                }
                if (data.response.players.length === 0) {
                    container.innerHTML = `
                        <div style="color:#f78166; text-align:center;">
                            ❌ Steam API вернул пустой список игроков.<br>
                            Вероятно, <strong>API-ключ недействителен</strong>.<br>
                            <small>Проверь ключ по прямой ссылке (откроется в новой вкладке):</small><br>
                            <a href="${apiUrl}" target="_blank" style="color:var(--accent2);">${apiUrl}</a><br>
                            <small>Если увидишь ошибку Forbidden или Unauthorized — получи новый ключ на <a href="https://steamcommunity.com/dev/apikey">steamcommunity.com/dev/apikey</a></small>
                        </div>`;
                    return;
                }
                renderCards(data.response.players);
            } catch (err) {
                console.error(err);
                debug.textContent += '\n\nОшибка: ' + err.message;
                container.innerHTML = `<div style="color:#f78166;">❌ ${err.message}</div>`;
            }
        }

        function renderCards(apiPlayers) {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = apiPlayers.map(p => {
                const state = p.personastate;
                let statusClass, statusText, icon;
                if (state === 0) {
                    statusClass = 'offline'; statusText = 'Не в сети'; icon = '⚫';
                } else if (state === 3) {
                    statusClass = 'in-game'; statusText = 'В игре'; icon = '🔵';
                } else {
                    statusClass = 'online'; statusText = 'В сети'; icon = '🟢';
                }

                const game = p.gameextrainfo || null;
                const gameIcon = game ? (game.toLowerCase().includes('scrap') ? '🔧' : '🎮') : '💤';
                const gameDisplay = game || '—';
                const avatar = p.avatarfull || p.avatar || '';

                return `
                <div class="card">
                    <div class="status-line ${statusClass}">
                        <span>${icon}</span>
                        <span>${statusText}</span>
                    </div>
                    <div class="header-row">
                        <img class="avatar" src="${avatar}" 
                             onerror="this.onerror=null;this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect fill=%22%23222%22 width=%22100%22 height=%22100%22/%3E%3Ctext x=%2250%22 y=%2255%22 text-anchor=%22middle%22 fill=%22%23fff%22 font-size=%2230%22%3E🔧%3C/text%3E%3C/svg%3E';">
                        <div class="info">
                            <h3>${p.personaname} ⭐</h3>
                            <div class="handle">Steam ID: ${p.steamid}</div>
                        </div>
                    </div>
                    <hr class="divider">
                    <div class="game-section">
                        <div class="game-icon">${gameIcon}</div>
                        <div class="game-detail">
                            <div class="label">Сейчас играет</div>
                            <div class="value">${gameDisplay}</div>
                            ${game ? `<div class="extra">В игре</div>` : ''}
                        </div>
                    </div>
                    <div class="extra">
                        📋 personastate: ${state} | 🔄 ${new Date().toLocaleTimeString()}
                    </div>
                </div>`;
            }).join('');
        }

        fetchStatuses();
        setInterval(fetchStatuses, 120000); // автообновление раз в 2 минуты
    </script>
</body>
</html>
